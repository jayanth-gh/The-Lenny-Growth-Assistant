services:
  db:
    image: postgres:16-alpine
    container_name: lenny_postgres
    restart: always
    environment:
      POSTGRES_USER: lenny_user
      POSTGRES_PASSWORD: lenny_password
      POSTGRES_DB: lenny_growth_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny_user -d lenny_growth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pi-agent:
    build:
      context: ./pi-agent
      dockerfile: Dockerfile
    container_name: lenny_pi_agent
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2
      - PI_AGENT_PORT=8090
    ports:
      - "8091:8090"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8090/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lenny_assistant_app
    restart: always
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql+asyncpg://lenny_user:lenny_password@db:5432/lenny_growth_db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - PI_AGENT_URL=http://pi-agent:8090
      - DEFAULT_LLM_PROVIDER=ollama
      - DEFAULT_LLM_MODEL=llama3.2
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      pi-agent:
        condition: service_healthy

volumes:
  postgres_data:
